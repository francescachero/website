<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal Website</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      background-image: url('images/first-page.jpg');
      background-size: cover;
      background-position: center;
      filter: grayscale(100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
    }

    .next-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      flex-wrap: wrap;
    }

    .nav-btn {
      background-color: #000;
      color: #fff;
      text-decoration: none;
      font-family: 'Georgia', serif;
      font-size: 1.1rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 18px 40px;
      border: 1px solid #000;
      transition: all 0.3s ease;
    }

    .nav-btn:hover {
      background-color: #fff;
      color: #000;
      letter-spacing: 4px;
    }

    @media (max-width: 576px) {
      .next-section {
        gap: 1.5rem;
        padding: 40px 20px;
      }

      .nav-btn {
        padding: 12px 28px;
        font-size: 0.9rem;
        letter-spacing: 2px;
      }
    }
  </style>
</head>
<body>

  <section class="hero" id="hero" onclick="document.getElementById('next').scrollIntoView({behavior: 'smooth'})"></section>

  <section class="next-section" id="next">
    <a href="about.html" class="nav-btn">About Me</a>
    <a href="projects.html" class="nav-btn">Projects</a>
    <a href="contact.html" class="nav-btn">Contact</a>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
